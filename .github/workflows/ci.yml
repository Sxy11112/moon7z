name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # js 后端要 Node 才能跑
      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit 版本
        run: moon version

      - name: 更新注册表索引
        run: moon update

      - name: 格式检查
        run: moon fmt --check

      - name: 检查（警告即失败）
        run: moon check --target wasm-gc --deny-warn

      - name: 构建
        run: moon build --target wasm-gc

      - name: 测试（wasm-gc 后端）
        run: moon test --target wasm-gc

      # 解码逻辑不依赖后端特性，js 后端应解出同样的结果
      - name: 测试（js 后端）
        run: moon test --target js

      # 兼容性验收：与第三方 7z 实现（bsdtar/libarchive、7-Zip）逐文件对拍
      - name: 安装对拍工具
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools p7zip-full python3

      - name: 语料清单（确认仓库里的语料在位）
        run: ls -l tools/corpus

      - name: 兼容性对拍（列目录 + 内容 CRC + 解包字节）
        run: |
          python3 tools/check_compat.py \
            --runner "moon run --target js cmd/main --" \
            --oracle bsdtar \
            --full-extract \
            --out COMPATIBILITY.ci.md \
            --min-ok 10
          head -40 COMPATIBILITY.ci.md
